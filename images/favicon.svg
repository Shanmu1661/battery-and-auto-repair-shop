<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="voltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#voltGrad)" stroke="#fde68a" stroke-width="1.5"/>
  <!-- Subtle battery terminal indicators at top -->
  <rect x="18" y="0.5" width="8" height="2.5" rx="1" fill="#d97706" opacity="0.8"/>
  <rect x="38" y="0.5" width="8" height="2.5" rx="1" fill="#d97706" opacity="0.8"/>
  <!-- Lightning Bolt -->
  <path d="M36 6 L18 34 H32 L26 58 L48 27 H33 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>