<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="heroLight" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#heroBg)"/>
  <rect width="1200" height="600" fill="url(#heroLight)"/>
  <!-- Modern car silhouette with electric glow lines -->
  <path d="M 450 380 Q 550 260 700 240 Q 850 220 950 270 L 1080 330 Q 1120 360 1100 400 L 450 400 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
  <!-- Front Headlight Projector Beam -->
  <polygon points="1080,335 1200,310 1200,430 1090,380" fill="#38bdf8" opacity="0.15"/>
  <polygon points="1080,340 1200,330 1200,410 1088,370" fill="#f59e0b" opacity="0.2"/>
  <!-- Wheels with electric rim glow -->
  <circle cx="580" cy="400" r="65" fill="#0f172a" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="580" cy="400" r="35" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="980" cy="400" r="65" fill="#0f172a" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="980" cy="400" r="35" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <!-- Tech multimeter graph line -->
  <path d="M 50 480 L 250 480 L 300 420 L 330 520 L 360 450 L 380 480 L 600 480" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="330" cy="520" r="6" fill="#ef4444"/>
  <circle cx="300" cy="420" r="6" fill="#10b981"/>
  <!-- Technician Tool Hologram / Quick Diagnostic Hub -->
  <rect x="80" y="160" width="340" height="240" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
  <rect x="105" y="185" width="290" height="36" rx="8" fill="#1e293b"/>
  <text x="120" y="209" font-family="monospace" font-size="14" fill="#38bdf8">⚡ SYSTEM HEALTH: 98.4%</text>
  <text x="120" y="250" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">Alternator Output: 14.4 V</text>
  <text x="120" y="280" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">Battery Health: 94% (Good)</text>
  <text x="120" y="310" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff">Parasitic Drain: 0.02 A (Normal)</text>
  <rect x="105" y="340" width="290" height="38" rx="8" fill="#f59e0b"/>
  <text x="250" y="365" font-family="sans-serif" font-weight="bold" font-size="15" fill="#0f172a" text-anchor="middle">24/7 MOBILE TECH READY</text>
</svg>
